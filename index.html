<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>Explore Cases — AFTERCASE</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="scripts/layout.js"></script>
    <script type="module" src="scripts/explore.js"></script>
    <script type="module" src="scripts/import-export.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="site-header"></div>
    <main id="main-content">
      <section class="page-intro" aria-labelledby="page-title">
        <p class="eyebrow">PERSONAL MYSTERY ARCHIVE</p>
        <h1 id="page-title">Explore Cases</h1>
        <p class="intro-copy">A quiet place to collect the details, sources, and questions that matter.</p>
      </section>
      <section class="archive-section" aria-labelledby="archive-heading">
        <div class="section-heading">
          <div><p class="eyebrow">YOUR ARCHIVE</p><h2 id="archive-heading">Cases</h2></div>
          <div class="section-actions">
            <p id="case-count" class="muted" aria-live="polite"></p>
            <a class="primary-button" href="case-form.html">Add Case</a>
          </div>
        </div>
        <div class="archive-tools">
          <label id="search" class="search-field" for="case-search">Search saved cases<input id="case-search" type="search" placeholder="Title, case number, keyword, person, location…" autocomplete="off"></label>
          <div class="archive-filters" aria-label="Filter cases">
            <label class="filter-field" for="case-status-filter">Real-world status
              <select id="case-status-filter"><option value="">All statuses</option><option value="Solved">Solved</option><option value="Unsolved">Unsolved</option><option value="Ongoing">Ongoing</option><option value="Unknown or disputed">Unknown or disputed</option></select>
            </label>
            <label class="filter-field" for="case-sort">Sort by
              <select id="case-sort"><option value="updated-desc">Recently updated</option><option value="title-asc">Title (A–Z)</option><option value="number-asc">Case number</option></select>
            </label>
          </div>
          <div class="data-actions" aria-label="Case data actions">
            <div class="view-switch" role="group" aria-label="Case display">
              <button id="grid-view" class="view-button active" type="button" aria-pressed="true">Grid</button>
              <button id="list-view" class="view-button" type="button" aria-pressed="false">List</button>
            </div>
            <button id="import-button" class="secondary-button" type="button">Import JSON</button>
            <button id="export-button" class="secondary-button" type="button">Export Backup</button>
          </div>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
        </div>
        <p id="archive-message" class="form-message" aria-live="polite"></p>
        <div id="case-list" class="case-grid" aria-live="polite" aria-busy="true"></div>
      </section>
      <dialog id="import-preview" class="import-dialog" aria-labelledby="import-preview-title">
        <div class="dialog-content">
          <p class="eyebrow">JSON IMPORT PREVIEW</p>
          <h2 id="import-preview-title">Review import</h2>
          <p id="import-summary" class="muted"></p>
          <ul id="import-problems" class="import-problems"></ul>
          <div id="import-case-list" class="import-case-list"></div>
          <div class="form-actions">
            <button id="cancel-import" class="text-button" type="button">Cancel</button>
            <button id="confirm-import" class="primary-button" type="button" disabled>Import non-conflicting cases</button>
          </div>
        </div>
      </dialog>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
