CE · RECORD · RETURN</text><text x="785" y="294" fill="#d9a96c" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.4">SIGN IN</text><text x="785" y="347" fill="#e9e4d9" font-family="Playfair Display, Georgia, serif" font-size="31" font-weight="500" >Return to your archive.</text><text x="785" y="382" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" >Keep the facts, sources, and questions together.</text><text x="785" y="438" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" >Username</text><rect x="785" y="450" width="445" height="50" rx="5" fill="#111412" stroke="#354039" /><text x="799" y="480" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" >Enter your username</text><text x="785" y="527" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" >Password</text><rect x="785" y="539" width="445" height="50" rx="5" fill="#111412" stroke="#354039" /><text x="799" y="569" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" >Enter your password</text><rect x="786" y="627" width="17" height="17" rx="3" fill="#111412" stroke="#354039"/><text x="815" y="641" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" >Keep me signed in on this device</text><rect x="785" y="682" width="445" height="48" rx="7" fill="#d9a96c" stroke="#d9a96c" /><text x="1007.5" y="711" fill="#111412" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Sign in</text><rect x="785" y="744" width="445" height="48" rx="7" fill="#191e1b" stroke="#354039" /><text x="1007.5" y="773" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Continue as Guest</text><text x="1007" y="827" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400