mily="Inter, Arial, sans-serif" font-size="14" font-weight="500" >Guest</text><text x="90" y="124" fill="#a5ada4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" >← Explore Cases</text><rect x="90" y="152" width="1260" height="225" rx="10" fill="#191e1b" stroke="#354039" stroke-width="1.2"/><path d="M91 155H280" stroke="#d9a96c" stroke-width="4"/><text x="126" y="195" fill="#d9a96c" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing="1.3">CASE 001</text><text x="126" y="241" fill="#e9e4d9" font-family="Playfair Display, Georgia, serif" font-size="36" font-weight="500" >The Northbridge Clock</text><rect x="126" y="263" width="92" height="28" rx="14" fill="#202622" stroke="#354039" /><circle cx="139" cy="277" r="3" fill="#a5ada4"/><text x="148" y="282" fill="#a5ada4" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing=".6">UNSOLVED</text><rect x="216" y="263" width="116" height="28" rx="14" fill="#392d20" stroke="#d9a96c" /><circle cx="229" cy="277" r="3" fill="#d9a96c"/><text x="238" y="282" fill="#d9a96c" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing=".6">IN PROGRESS</text><rect x="126" y="310" width="125" height="46" rx="7" fill="#d9a96c" stroke="#d9a96c" /><text x="188.5" y="338" fill="#111412" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Edit Case</text><rect x="265" y="310" width="237" height="46" rx="7" fill="#191e1b" stroke="#354039" /><text x="383.5" y="338" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Add to My Archive watchlist</text><rect x="1248" y="310" width="82" height="46" rx="7" fill="#191e1b" stroke="#354039" /><text x="1289" y="338" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Delete</text><rect x="90" y="404" width="1260" height="216" rx="9" fill="#191e1b" stroke="#354039" /><path d="M111 405H231" stroke="#d9a96c" stroke-width="4"/><text x="120" y="448" fill="#e9e4d9" font-family="Playfair Display, Georgia, serif" font-size="23" font-weight="500" >Overview</text><text x="120" y="486" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" >A concise case summary appears here, with key context and a note about what still needs</text><text x="120" y="512" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" >to be verified. Sources and accounts are kept distinct so the record remains easy to</text><text x="120" y="538" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" >review and continue researching.</text><rect x="90" y="645" width="1260" height="244" rx="9" fill="#191e1b" stroke="#354039" /><path d="M111 646H231" stroke="#d9a96c" stroke-width="4"/><text x="120" y="690" fill="#e9e4d9" font-family="Playfair Display, Georgia, serif" font-size="23" font-weight="500" >Timeline</text><path d="M137 717V852" stroke="#354039" stroke-width="2"/><circle cx="137" cy="727" r="5" fill="#d9a96c"/><text x="160" y="731" fill="#d9a96c" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500" >14 MAY 1998</text><text x="290" y="731" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" >A record is added to the archive.</text><circle cx="137" cy="778" r="5" fill="#d9a96c"/><text x="160" y="782" fill="#d9a96c" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500" >02 JUN 1998</text><text x="290" y="782" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" >A new witness statement is documented.</text><circle cx="137" cy="829" r="5" fill="#d9a96c"/><text x="160" y="833" fill="#d9a96c" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500" >18 SEP 1998</text><text x="290" y="833" fill="#e9e4d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" >The case status is reviewed.</text><path d="M90 950H1350" stroke="#354039"/><text x="90" y="978" fill="#a5ada4" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1">AFTERCASE · A PERSONAL MYSTERY ARCHIVE</text></svg>